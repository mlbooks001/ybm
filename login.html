<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YBM FC - 로그인</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html"><h1>⚽ YBM FC</h1></a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">홈</a></li>
                <li><a href="index.html#about">팀 소개</a></li>
                <li><a href="index.html#players">선수단</a></li>
                <li><a href="index.html#schedule">경기 일정</a></li>
                <li><a href="index.html#news">뉴스</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-box">
                <h2>로그인</h2>
                <p class="auth-subtitle">YBM FC 회원 로그인</p>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">아이디</label>
                        <input type="text" id="username" name="username" required placeholder="아이디를 입력하세요">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요">
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span>로그인 상태 유지</span>
                        </label>
                    </div>
                    
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    
                    <button type="submit" class="btn-submit">로그인</button>
                </form>
                
                <div class="auth-links">
                    <p>아직 회원이 아니신가요? <a href="register.html">회원가입</a></p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 YBM FC. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorMessage = document.getElementById('errorMessage');
            
            // localStorage에서 사용자 정보 가져오기
            const users = JSON.parse(localStorage.getItem('ybmfc_users') || '[]');
            
            // 사용자 인증
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                // 로그인 성공
                const loginData = {
                    username: user.username,
                    name: user.name,
                    email: user.email,
                    loginTime: new Date().toISOString()
                };
                
                if (rememberMe) {
                    localStorage.setItem('ybmfc_user', JSON.stringify(loginData));
                } else {
                    sessionStorage.setItem('ybmfc_user', JSON.stringify(loginData));
                }
                
                alert('로그인 성공! 환영합니다, ' + user.name + '님!');
                window.location.href = 'index.html';
            } else {
                // 로그인 실패
                errorMessage.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>

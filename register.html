<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YBM FC - 회원가입</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase 클라이언트 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-helpers.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html"><h1>⚽ YBM FC</h1></a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">홈</a></li>
                <li><a href="index.html#about">팀소개</a></li>
                <li><a href="index.html#news">회원소식</a></li>
                <li><a href="index.html#schedule">경기일정</a></li>
                <li><a href="register.html">가입문의</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-box">
                <h2 id="registerTitle">회원가입</h2>
                <p class="auth-subtitle" id="registerSubtitle">YBM FC의 새로운 멤버가 되어주세요</p>
                
                <div id="registerInfoContent" class="register-info-content" style="display: none;">
                    <div id="registerContent"></div>
                    <div id="registerContact" class="register-contact"></div>
                </div>
                
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" required placeholder="이름을 입력하세요">
                    </div>
                    
                    <div class="form-group">
                        <label for="username">아이디</label>
                        <input type="text" id="username" name="username" required placeholder="아이디를 입력하세요" minlength="4">
                        <small>4자 이상의 아이디를 입력해주세요</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" required placeholder="이메일을 입력하세요">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요" minlength="6">
                        <small>6자 이상의 비밀번호를 입력해주세요</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">비밀번호 확인</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="비밀번호를 다시 입력하세요">
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="agreeTerms" required>
                            <span>이용약관 및 개인정보처리방침에 동의합니다</span>
                        </label>
                    </div>
                    
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    <div id="successMessage" class="success-message" style="display: none;"></div>
                    
                    <button type="submit" class="btn-submit">가입하기</button>
                </form>
                
                <div class="auth-links">
                    <p>이미 회원이신가요? <a href="login.html">로그인</a></p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 YBM FC. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // 페이지 로드 시 안내글 로드
        document.addEventListener('DOMContentLoaded', function() {
            loadRegisterInfo();
        });

        // 가입문의 안내글 로드
        function loadRegisterInfo() {
            const registerInfo = JSON.parse(localStorage.getItem('ybmfc_register_info') || '{}');
            
            if (registerInfo.title) {
                document.getElementById('registerTitle').textContent = registerInfo.title;
            }
            
            if (registerInfo.subtitle) {
                document.getElementById('registerSubtitle').textContent = registerInfo.subtitle;
            }
            
            const contentDiv = document.getElementById('registerContent');
            const contactDiv = document.getElementById('registerContact');
            const infoContent = document.getElementById('registerInfoContent');
            
            if (registerInfo.content) {
                contentDiv.innerHTML = registerInfo.content.replace(/\n/g, '<br>');
                infoContent.style.display = 'block';
            }
            
            if (registerInfo.contact) {
                const contactLines = registerInfo.contact.split('\n');
                contactDiv.innerHTML = contactLines.map(line => `<p>${line}</p>`).join('');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // 에러 메시지 초기화
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // 비밀번호 확인
            if (password !== confirmPassword) {
                errorMessage.textContent = '비밀번호가 일치하지 않습니다.';
                errorMessage.style.display = 'block';
                return;
            }
            
            // 약관 동의 확인
            if (!agreeTerms) {
                errorMessage.textContent = '이용약관에 동의해주세요.';
                errorMessage.style.display = 'block';
                return;
            }
            
            // localStorage에서 기존 사용자 목록 가져오기
            const users = JSON.parse(localStorage.getItem('ybmfc_users') || '[]');
            
            // 중복 아이디 확인
            if (users.some(u => u.username === username)) {
                errorMessage.textContent = '이미 사용 중인 아이디입니다.';
                errorMessage.style.display = 'block';
                return;
            }
            
            // 중복 이메일 확인
            if (users.some(u => u.email === email)) {
                errorMessage.textContent = '이미 사용 중인 이메일입니다.';
                errorMessage.style.display = 'block';
                return;
            }
            
            // 새 사용자 추가
            const newUser = {
                name: name,
                username: username,
                email: email,
                password: password,
                registeredDate: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('ybmfc_users', JSON.stringify(users));
            
            successMessage.textContent = '회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.';
            successMessage.style.display = 'block';
            
            // 2초 후 로그인 페이지로 이동
            setTimeout(function() {
                window.location.href = 'login.html';
            }, 2000);
        });
    </script>
</body>
</html>
